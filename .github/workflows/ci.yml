name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The plugin is built at release time, so a compile break must not wait
  # until then to surface.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          # Runs Gradle and satisfies the plugin's Java 17 toolchain.
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Goes through the npm script, so a break in it fails here too.
      - name: Build the IntelliJ plugin
        run: npm run build:plugin

  # Same reason as the plugin: the extension is built at release time, so a
  # compile or test break must not wait until then to surface.
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extra/vscode/snipshot-vscode/package-lock.json

      # Goes through the npm script, so a break in it fails here too.
      - name: Build the VS Code extension
        run: npm run build:vscode

      # The integration tests run the extension in a real VS Code, driving the
      # real CLI from dist/, and read the clipboard back through xclip.
      - name: Build the CLI
        run: npm ci && npm run build

      - name: Cache the VS Code build the integration tests run in
        uses: actions/cache@v4
        with:
          path: extra/vscode/snipshot-vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('extra/vscode/snipshot-vscode/.vscode-test.mjs') }}

      - name: Install a clipboard tool
        run: sudo apt-get update && sudo apt-get install -y xclip

      - name: Integration tests in a real VS Code
        working-directory: extra/vscode/snipshot-vscode
        run: xvfb-run -a npm run test:integration
